services:
  benoitlaprise:
    build: .
    container_name: benoitlaprise
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - benoitlaprise-api

  benoitlaprise-api:
    build: ./api
    container_name: benoitlaprise-api
    restart: unless-stopped
    environment:
      PGHOST: benoitlaprise-db
      PGPORT: 5432
      PGUSER: benoitlaprise
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: benoitlaprise
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - benoitlaprise-db

  benoitlaprise-db:
    image: postgres:16-alpine
    container_name: benoitlaprise-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: benoitlaprise
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: benoitlaprise
    volumes:
      - benoitlaprise-db-data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # ---------- Chatwoot (clavardage en direct, auto-hébergé) ----------

  chatwoot-rails:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot-rails
    restart: unless-stopped
    depends_on:
      - chatwoot-db
      - chatwoot-redis
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      DEFAULT_LOCALE: fr
      FORCE_SSL: "true"
      ENABLE_ACCOUNT_SIGNUP: "false"
      POSTGRES_HOST: chatwoot-db
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD}@chatwoot-redis:6379
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    ports:
      - "8098:3000"
    volumes:
      - chatwoot-storage:/app/storage

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot-sidekiq
    restart: unless-stopped
    depends_on:
      - chatwoot-db
      - chatwoot-redis
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_FRONTEND_URL}
      DEFAULT_LOCALE: fr
      POSTGRES_HOST: chatwoot-db
      POSTGRES_USERNAME: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://:${CHATWOOT_REDIS_PASSWORD}@chatwoot-redis:6379
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot-storage:/app/storage

  chatwoot-db:
    image: pgvector/pgvector:pg16
    container_name: chatwoot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD}
    volumes:
      - chatwoot-db-data:/var/lib/postgresql/data

  chatwoot-redis:
    image: redis:alpine
    container_name: chatwoot-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$CHATWOOT_REDIS_PASSWORD\""]
    environment:
      CHATWOOT_REDIS_PASSWORD: ${CHATWOOT_REDIS_PASSWORD}
    volumes:
      - chatwoot-redis-data:/data

volumes:
  benoitlaprise-db-data:
  chatwoot-storage:
  chatwoot-db-data:
  chatwoot-redis-data:
