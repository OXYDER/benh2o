<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carte de couverture — Benoît Laprise, H2O Innovation</title>
<meta name="description" content="Carte des municipalités et MRC desservies par Benoît Laprise, H2O Innovation — version grand format, pour impression.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/gif" href="assets/favicon-animated.gif?v=109">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="assets/style.css?v=113">
<style>
  html, body { margin: 0; }
  body { background: var(--birch-100); }
  .carte-page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 20px;
    background: var(--birch-050);
    border-bottom: 1px solid rgba(32,27,20,0.12);
  }
  .carte-page-header h1 {
    font-family: var(--serif);
    font-size: 1.15rem;
    margin: 0;
    color: var(--ink-900);
  }
  .carte-page-header .btn { white-space: nowrap; }
  #coverage-map {
    width: 100%;
    height: 900px;
    border-radius: 0 !important;
    border: none !important;
    margin: 0;
  }
  @media print {
    @page { size: landscape; margin: 10mm; }
    .carte-page-header .btn { display: none; }
    .map-zoom-hint { display: none !important; }
  }
</style>
</head>
<body>

<div class="carte-page-header">
  <h1>Territoire desservi — Benoît Laprise, H2O Innovation</h1>
  <button type="button" class="btn btn-primary" id="print-map-btn">🖨 Imprimer</button>
</div>

<div id="coverage-map" aria-label="Carte des municipalités et MRC desservies par Benoît Laprise"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/coverage-map.js?v=113"></script>
<script>
  document.getElementById("print-map-btn").addEventListener("click", () => window.print());
</script>

</html>
