server {
    listen 80;
    server_name benoitlaprise.com www.benoitlaprise.com;

    client_max_body_size 100M;

    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://benoitlaprise-api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        return 301 /;
    }

    location = /admin {
        try_files /admin.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /admin.html {
        return 301 /admin;
    }

    location = /nouvelles {
        try_files /nouvelles.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /nouvelles.html {
        return 301 /nouvelles;
    }

    location = /tutoriels {
        try_files /tutoriels.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /tutoriels.html {
        return 301 /tutoriels;
    }

    location = /manuels {
        try_files /manuels.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /manuels.html {
        return 301 /manuels;
    }

    location = /fiches-techniques {
        try_files /fiches-techniques.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /fiches-techniques.html {
        return 301 /fiches-techniques;
    }

    location = /equipements-usages {
        try_files /equipements-usages.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /equipements-usages.html {
        return 301 /equipements-usages;
    }

    location = /convertisseur {
        try_files /convertisseur.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /convertisseur.html {
        return 301 /convertisseur;
    }

    location = /carte-imprimable {
        try_files /carte.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /carte.html {
        return 301 /carte-imprimable;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:html|css|js|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript text/html;
}
